<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ฝึกอ่านโน้ต เพลงเต้ยโขง</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <style>
    .wrap { max-width: 900px; margin: 0 auto; text-align: center; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin: 8px 0; }
    .controls button:disabled { opacity: 0.45; cursor: default; }
    #modeLabel { font-size: 14px; color: #555; margin: 4px 0; }

    /* 1 บรรทัด = 8 ห้อง แบ่งเป็น 2 ครึ่ง (ครึ่งละ 4 ห้อง) จอแคบจะตัดเป็น 4 + 4 */
    .song-line { display: flex; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
    .song-line[hidden] { display: none !important; }
    .line-no { width: 100%; font-size: 12px; color: #888; text-align: left; }
    .half { display: grid; grid-template-columns: repeat(4, auto); }
    .bar {
      border: 1px solid black;
      margin: -1px 0 0 -1px;
      padding: 4px 3px;
      white-space: nowrap;
      font-size: 22px;
      line-height: 1.6;
      transition: background-color 0.2s;
    }
    .bar span { display: inline-block; width: 1.3em; text-align: center; }
    .bar span.strong { color: red; }
    .song-line.new .bar { animation: flash 0.8s; }
    /* เอฟเฟกต์สลอต: ภาพสั่นขึ้นลงและเบลอขณะหมุน แล้วเด้งเมื่อหยุด */
    .bar span.spin { animation: reel 0.07s linear infinite; filter: blur(0.6px); }
    .bar span.landed { animation: land 0.3s ease-out; }
    @keyframes reel { from { transform: translateY(-30%); } to { transform: translateY(30%); } }
    @keyframes land { 0% { transform: translateY(-25%) scale(1.25); } 60% { transform: translateY(6%); } 100% { transform: none; } }
    @keyframes flash { from { background-color: #ffd54f; } to { background-color: transparent; } }

    #legend { margin: 12px auto; }
    #legend td { text-align: center; padding: 2px 8px; font-size: 20px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h3>ฝึกอ่านโน้ต เพลงเต้ยโขง</h3>

    <div class="controls">
      <button type="button" id="nextBtn">แสดงบรรทัดถัดไป</button>
      <button type="button" id="shuffleBtn">🎲 สุ่มอีโมจี</button>
      <button type="button" id="noteBtn">แสดงตัวโน้ต</button>
      <button type="button" id="resetBtn">เริ่มใหม่</button>
    </div>
    <p id="modeLabel"></p>

    <div id="song"></div>

    <table id="legend" hidden></table>

    <p><a href="./index.html">กลับหน้าแรก</a></p>
  </div>

  <script>
    // ---------- เพลงเต้ยโขง (ตัวเลข 1–8 แทนเสียง ด ร ม ฟ ซ ล ท ดํ) ----------
    const SONG = [
      '---- ---6 ---5 -3-6 ---5 -8-6 ---5 -3-6',
      '---- ---6 ---5 -3-6 ---5 -8-6 ---5 -3-6',
      '---- -5-3 ---2 -1-3 ---2 -5-3 ---2 -1-6',
      '---1 -2-3 -2-1 -5-6 ---1 -2-3 -2-1 -5-6'
    ].map(line => line.split(' '));

    const NOTES = { 1: 'ด', 2: 'ร', 3: 'ม', 4: 'ฟ', 5: 'ซ', 6: 'ล', 7: 'ท', 8: 'ดํ' };
    const PALETTE = ['🍊', '🍌', '🐻', '😺', '🙈', '🐘', '🐟', '🐶', '🐖', '🐔', '🐍', '🐱',
      '🌶️', '🦑', '🐷', '🐹', '🐸', '🦆', '🐴', '🐓', '🐼'];
    // ตัวเลขที่ใช้จริงในเพลง (ใช้แสดงตารางเทียบ)
    const USED = [...new Set(SONG.flat().join('').replace(/-/g, ''))].sort();

    const songEl = document.getElementById('song');
    const legendEl = document.getElementById('legend');
    const nextBtn = document.getElementById('nextBtn');
    const noteBtn = document.getElementById('noteBtn');
    const modeLabel = document.getElementById('modeLabel');

    let shown = 1;          // จำนวนบรรทัดที่แสดงอยู่
    let showNotes = false;  // false = อีโมจี, true = ตัวโน้ต
    let emojiOf = {};       // ตัวเลข -> อีโมจี

    function shuffleEmoji() {
      const pool = PALETTE.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      emojiOf = {};
      for (let n = 1; n <= 8; n++) emojiOf[n] = pool[n - 1];
    }

    function symbol(ch) {
      if (ch === '-') return '-';
      return showNotes ? NOTES[ch] : emojiOf[ch];
    }

    function render() {
      songEl.innerHTML = '';
      SONG.forEach((bars, li) => {
        const line = document.createElement('div');
        line.className = 'song-line';
        line.hidden = li >= shown;
        line.innerHTML = '<div class="line-no">บรรทัดที่ ' + (li + 1) + '</div>';
        [bars.slice(0, 4), bars.slice(4)].forEach((group, gi) => {
          const half = document.createElement('div');
          half.className = 'half';
          group.forEach((bar, bi) => {
            const cell = document.createElement('div');
            cell.className = 'bar';
            [...bar].forEach((ch, i) => {
              const s = document.createElement('span');
              s.textContent = symbol(ch);
              s.dataset.d = ch;
              s.dataset.col = gi * 4 + bi; // ห้องที่ 0–7 ในบรรทัด ใช้กำหนดเวลาหยุดหมุน
              if (i === 3 && ch !== '-') s.className = 'strong'; // ตัวที่ 4 = จังหวะตก
              cell.appendChild(s);
            });
            half.appendChild(cell);
          });
          line.appendChild(half);
        });
        songEl.appendChild(line);
      });

      // ตารางเทียบ อีโมจี = โน้ต (แสดงเฉพาะตอนเฉลย)
      legendEl.hidden = !showNotes;
      legendEl.innerHTML =
        '<tr><td>อีโมจี</td>' + USED.map(n => '<td>' + emojiOf[n] + '</td>').join('') + '</tr>' +
        '<tr><td>โน้ต</td>' + USED.map(n => '<td>' + NOTES[n] + '</td>').join('') + '</tr>';

      nextBtn.disabled = shown >= SONG.length;
      nextBtn.textContent = 'แสดงบรรทัดถัดไป (' + shown + '/' + SONG.length + ')';
      noteBtn.textContent = showNotes ? 'กลับเป็นอีโมจี' : 'แสดงตัวโน้ต';
      modeLabel.textContent = showNotes ? 'กำลังแสดง: ตัวโน้ต' : 'กำลังแสดง: อีโมจี (ลองอ่านเป็นตัวโน้ตดู)';
    }

    nextBtn.addEventListener('click', () => {
      if (shown >= SONG.length) return;
      shown++;
      render();
      const line = songEl.children[shown - 1];
      line.classList.add('new');
      line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // ---------- สุ่มแบบสลอต: อีโมจีหมุนเร็ว ๆ แล้วหยุดทีละห้องจากซ้ายไปขวา ----------
    const controlBtns = document.querySelectorAll('.controls button');
    let spinning = false;

    function spin() {
      if (spinning) return;
      spinning = true;
      showNotes = false;
      shuffleEmoji();   // ผลลัพธ์สุดท้าย สุ่มไว้ก่อนเริ่มหมุน
      render();
      controlBtns.forEach(b => b.disabled = true);

      const reels = [...songEl.querySelectorAll('.bar span')].filter(s => s.dataset.d !== '-');
      const START = 600, STEP = 150, TICK = 70; // ms: หมุนก่อนหยุดห้องแรก, ห่างกันต่อห้อง, ความเร็วเปลี่ยนภาพ
      const t0 = performance.now();
      reels.forEach(s => s.classList.add('spin'));

      const timer = setInterval(() => {
        const elapsed = performance.now() - t0;
        let still = 0;
        reels.forEach(s => {
          if (!s.classList.contains('spin')) return;
          if (elapsed >= START + s.dataset.col * STEP) {
            s.textContent = emojiOf[s.dataset.d];   // หยุดที่ผลจริง
            s.classList.remove('spin');
            s.classList.add('landed');
          } else {
            s.textContent = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            still++;
          }
        });
        if (!still) {
          clearInterval(timer);
          spinning = false;
          controlBtns.forEach(b => b.disabled = false);
          render();   // ปุ่มบรรทัดถัดไปจะถูกปิดอีกครั้งถ้าแสดงครบแล้ว
        }
      }, TICK);
    }

    document.getElementById('shuffleBtn').addEventListener('click', spin);

    noteBtn.addEventListener('click', () => {
      showNotes = !showNotes;
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      shown = 1;
      spin();
    });

    // กด Space เพื่อสุ่ม (เหมือนหน้า 4bars)
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) {
        e.preventDefault();
        spin();
      }
    });

    shuffleEmoji();
    render();
  </script>
  <script src="nav.js"></script>
</body>
</html>
