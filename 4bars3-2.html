<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ฝึกอ่านโน้ตดนตรีไทย</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
</head>

  <body>
    <center>
      <h3>ฝึกอ่านโน้ตดนตรีไทย แบบที่ 2</h3>
      <h>ให้นักเรียนอ่าน 2 แบบฝึก</h>
      <h2>-x-x, ---x</h2>
      <table style="width:300px;table-layout:fixed">
        <thead style="text-align:center">
          <tr>
            <td>-<span id="bar1">-</span>-<span id="bar5">-</span></td>
            <td>-<span id="bar2">-</span>-<span id="bar6">-</span></td>
            <td>-<span id="bar3">-</span>-<span id="bar7">-</span></td>
            <td>-<span id="bar4">-</span>-<span id="bar8">-</span></td>
            </td>
          </tr>
        </thead>
      </table>
      </table>
      <button id="btn" onclick="changeText();">เริ่มสุ่ม</button>
  </body>
  <script>
    function changeText() {
        if (document.getElementById("btn").textContent == "หยุด") {
          document.getElementById("btn").textContent = "เริ่มสุ่ม";
          stop();
        } else {
          document.getElementById("btn").textContent = "หยุด";
          start();
        }
    }


    var interval = 0;

    function start() {
      interval = setInterval(getRandomEmoji, 10);
      setTimeout(() => {
        stop()
        changeText()
      }, 1000)
      }

    function stop() {
      clearInterval(interval);
      }

    function getRandomEmoji() {
      const emoji = ['🐶','🐱','🐘','🍊','🍌','🌶️','-','-','-','-']
      // const emoji = ['🐶','🐱','🐻','🐷','🍌','🦑','-','-','-','-']
      const index1 = Math.floor(Math.random() * 7);
      document.getElementById("bar1").innerHTML = emoji[index1];
      const index2 = Math.floor(Math.random() * 7);
      document.getElementById("bar2").innerHTML = emoji[index2];
      const index3 = Math.floor(Math.random() * 7);
      document.getElementById("bar3").innerHTML = emoji[index3];
      const index4 = Math.floor(Math.random() * 5);
      document.getElementById("bar4").innerHTML = emoji[index4];
      const index5 = Math.floor(Math.random() * 5);
      document.getElementById("bar5").innerHTML = emoji[index5];
      const index6 = Math.floor(Math.random() * 4);
      document.getElementById("bar6").innerHTML = emoji[index6];
      const index7 = Math.floor(Math.random() * 4);
      document.getElementById("bar7").innerHTML = emoji[index7];
      const index8 = Math.floor(Math.random() * 4);
      document.getElementById("bar8").innerHTML = emoji[index8];

      const index10 = Math.floor(Math.random() * 7);
      document.getElementById("bar10").innerHTML = emoji[index10];
      const index11 = Math.floor(Math.random() * 7);
      document.getElementById("bar11").innerHTML = emoji[index11];
      const index12 = Math.floor(Math.random() * 7);
      document.getElementById("bar12").innerHTML = emoji[index12];
      const index13 = Math.floor(Math.random() * 5);
      document.getElementById("bar13").innerHTML = emoji[index13];
      const index14 = Math.floor(Math.random() * 4);
      document.getElementById("bar14").innerHTML = emoji[index14];
      const index15 = Math.floor(Math.random() * 4);
      document.getElementById("bar15").innerHTML = emoji[index15];
      const index16 = Math.floor(Math.random() * 4);
      document.getElementById("bar16").innerHTML = emoji[index16];
      const index17 = Math.floor(Math.random() * 4);
      document.getElementById("bar17").innerHTML = emoji[index17];
    }

  </script>
  <script src="nav.js"></script>

</body>

</html>
