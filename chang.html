<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ฝึกอ่านโน้ต เพลงช้าง (พม่าเขว)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <style>
    .wrap { max-width: 900px; margin: 0 auto; text-align: center; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin: 8px 0; }
    .controls button:disabled { opacity: 0.45; cursor: default; }
    #modeLabel { font-size: 14px; color: #555; margin: 4px 0; }

    /* 1 บรรทัดเพลง = 8 ห้อง แบ่งเป็น 2 ครึ่ง (ครึ่งละ 4 ห้อง) */
    .song-line { margin: 10px 0; }
    .song-line[hidden] { display: none !important; }
    .line-no { font-size: 12px; color: #888; text-align: left; }
    .bars { display: flex; justify-content: safe center; }
    .half { display: grid; grid-template-columns: repeat(4, auto); }
    /* แบบ 2 บรรทัด × 4 ห้อง: ครึ่งหลังขึ้นบรรทัดใหม่ */
    #song.layout-4 .bars { flex-direction: column; align-items: center; }
    /* แบบ 1 บรรทัด × 8 ห้อง: ไม่ตัดบรรทัด จอแคบให้เลื่อนซ้ายขวา */
    /* ขนาดตัวอักษรคำนวณจากความกว้างจริงของบรรทัด: 8 ห้อง × 4 ตัว × 1.05em + padding/เส้นขอบห้องละ ~6px */
    #song.layout-8 .song-line { container-type: inline-size; }
    #song.layout-8 .bars { flex-wrap: nowrap; overflow-x: auto; padding: 1px 0 0 1px; }
    #song.layout-8 .bar { padding: 3px 2px; font-size: min(22px, calc((100cqw - 52px) / 33.6)); }
    #song.layout-8 .bar span { width: 1.05em; }
    .controls label { align-self: center; }
    #layoutSelect { font-family: 'K2D', sans-serif; font-size: 16px; padding: 6px; border: 2px solid #f44336; }
    .bar {
      border: 1px solid black;
      margin: -1px 0 0 -1px;
      padding: 4px 3px;
      white-space: nowrap;
      font-size: 22px;
      line-height: 1.6;
      transition: background-color 0.2s;
    }
    .bar span { display: inline-block; width: 1.3em; text-align: center; }
    .bar span.strong { color: red; }
    .song-line.new .bar { animation: flash 0.8s; }
    /* เอฟเฟกต์สลอต: ภาพสั่นขึ้นลงและเบลอขณะหมุน แล้วเด้งเมื่อหยุด */
    .bar span.spin { animation: reel 0.07s linear infinite; filter: blur(0.6px); }
    .bar span.landed { animation: land 0.3s ease-out; }
    @keyframes reel { from { transform: translateY(-30%); } to { transform: translateY(30%); } }
    @keyframes land { 0% { transform: translateY(-25%) scale(1.25); } 60% { transform: translateY(6%); } 100% { transform: none; } }
    @keyframes flash { from { background-color: #ffd54f; } to { background-color: transparent; } }

  </style>
</head>

<body>
  <div class="wrap">
    <h3>ฝึกอ่านโน้ต เพลงช้าง (พม่าเขว)</h3>

    <div class="controls">
      <button type="button" id="shuffleBtn">🎲 สุ่มอีโมจี</button>
      <button type="button" id="noteBtn">แสดงตัวโน้ต</button>
      <button type="button" id="prevBtn">◀ ย้อนกลับ</button>
      <button type="button" id="nextBtn">แสดงบรรทัดถัดไป</button>
    </div>
    <div class="controls">
      <label for="layoutSelect">รูปแบบการแสดง:</label>
      <select id="layoutSelect">
        <option value="4">แสดงทีละ 2 บรรทัด (บรรทัดละ 4 ห้อง)</option>
        <option value="8">แสดงทีละ 1 บรรทัด (บรรทัดละ 8 ห้อง)</option>
      </select>
    </div>
    <p id="modeLabel"></p>

    <div id="song"></div>


    <p><a href="./index.html">กลับหน้าแรก</a></p>
  </div>

  <script>
    // ---------- เพลงช้าง (พม่าเขว) (ตัวเลข 1–8 แทนเสียง ด ร ม ฟ ซ ล ท ดํ, 8 = ดํ เขียนในต้นฉบับว่า 1*) ----------
    const SONG = [
      '---- ---5 ---5 ---5 ---- -5-3 --23 -5-1',
      '---- ---5 ---5 ---5 ---- -5-3 --23 -5-1',
      '---- -5-3 --23 -1-2 -8-6 -8-8 --56 -8--',
      '-8-6 -8-8 --56 -8-- -5-6 -5-3 ---2 ---1'
    ].map(line => line.split(' '));

    const NOTES = { 1: 'ด', 2: 'ร', 3: 'ม', 4: 'ฟ', 5: 'ซ', 6: 'ล', 7: 'ท', 8: 'ดํ' };
    const PALETTE = ['🍊', '🍌', '🐻', '😺', '🙈', '🐘', '🐟', '🐶', '🐖', '🐔', '🐍', '🐱',
      '🌶️', '🦑', '🐷', '🐹', '🐸', '🦆', '🐴', '🐓', '🐼'];

    const songEl = document.getElementById('song');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const noteBtn = document.getElementById('noteBtn');
    const modeLabel = document.getElementById('modeLabel');

    let shown = 1;          // จำนวนบรรทัดที่แสดงอยู่
    let showNotes = false;  // false = อีโมจี, true = ตัวโน้ต
    let emojiOf = {};       // ตัวเลข -> อีโมจี

    function shuffleEmoji() {
      const pool = PALETTE.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      emojiOf = {};
      for (let n = 1; n <= 8; n++) emojiOf[n] = pool[n - 1];
    }

    function symbol(ch) {
      if (ch === '-') return '-';
      return showNotes ? NOTES[ch] : emojiOf[ch];
    }

    function render() {
      songEl.innerHTML = '';
      SONG.forEach((bars, li) => {
        const line = document.createElement('div');
        line.className = 'song-line';
        line.hidden = li >= shown;
        line.innerHTML = '<div class="line-no">บรรทัดที่ ' + (li + 1) + '</div>';
        const barsEl = document.createElement('div');
        barsEl.className = 'bars';
        line.appendChild(barsEl);
        [bars.slice(0, 4), bars.slice(4)].forEach((group, gi) => {
          const half = document.createElement('div');
          half.className = 'half';
          group.forEach((bar, bi) => {
            const cell = document.createElement('div');
            cell.className = 'bar';
            [...bar].forEach((ch, i) => {
              const s = document.createElement('span');
              s.textContent = symbol(ch);
              s.dataset.d = ch;
              s.dataset.col = gi * 4 + bi; // ห้องที่ 0–7 ในบรรทัด ใช้กำหนดเวลาหยุดหมุน
              if (i === 3 && ch !== '-') s.className = 'strong'; // ตัวที่ 4 = จังหวะตก
              cell.appendChild(s);
            });
            half.appendChild(cell);
          });
          barsEl.appendChild(half);
        });
        songEl.appendChild(line);
      });

      nextBtn.disabled = shown >= SONG.length;
      prevBtn.disabled = shown <= 1;
      nextBtn.textContent = 'แสดงบรรทัดถัดไป (' + shown + '/' + SONG.length + ')';
      noteBtn.textContent = showNotes ? 'กลับเป็นอีโมจี' : 'แสดงตัวโน้ต';
      modeLabel.textContent = showNotes ? 'กำลังแสดง: ตัวโน้ต' : 'กำลังแสดง: อีโมจี (ลองอ่านเป็นตัวโน้ตดู)';
    }

    nextBtn.addEventListener('click', () => {
      if (shown >= SONG.length) return;
      shown++;
      render();
      const line = songEl.children[shown - 1];
      line.classList.add('new');
      line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // ย้อนกลับ: ซ่อนบรรทัดล่าสุด (เหลืออย่างน้อย 1 บรรทัด)
    prevBtn.addEventListener('click', () => {
      if (shown <= 1) return;
      shown--;
      render();
    });

    // ---------- สุ่มแบบสลอต: อีโมจีหมุนเร็ว ๆ แล้วหยุดทีละห้องจากซ้ายไปขวา ----------
    const controlBtns = document.querySelectorAll('.controls button');
    let spinning = false;

    function spin() {
      if (spinning) return;
      spinning = true;
      showNotes = false;
      shuffleEmoji();   // ผลลัพธ์สุดท้าย สุ่มไว้ก่อนเริ่มหมุน
      render();
      controlBtns.forEach(b => b.disabled = true);

      const reels = [...songEl.querySelectorAll('.bar span')].filter(s => s.dataset.d !== '-');
      const START = 600, STEP = 150, TICK = 70; // ms: หมุนก่อนหยุดห้องแรก, ห่างกันต่อห้อง, ความเร็วเปลี่ยนภาพ
      const t0 = performance.now();
      reels.forEach(s => s.classList.add('spin'));

      const timer = setInterval(() => {
        const elapsed = performance.now() - t0;
        let still = 0;
        reels.forEach(s => {
          if (!s.classList.contains('spin')) return;
          if (elapsed >= START + s.dataset.col * STEP) {
            s.textContent = emojiOf[s.dataset.d];   // หยุดที่ผลจริง
            s.classList.remove('spin');
            s.classList.add('landed');
          } else {
            s.textContent = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            still++;
          }
        });
        if (!still) {
          clearInterval(timer);
          spinning = false;
          controlBtns.forEach(b => b.disabled = false);
          render();   // ปุ่มบรรทัดถัดไปจะถูกปิดอีกครั้งถ้าแสดงครบแล้ว
        }
      }, TICK);
    }

    document.getElementById('shuffleBtn').addEventListener('click', spin);

    noteBtn.addEventListener('click', () => {
      showNotes = !showNotes;
      render();
    });

    // กด Space เพื่อสุ่ม (เหมือนหน้า 4bars)
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) {
        e.preventDefault();
        spin();
      }
    });

    // ---------- รูปแบบการแสดง: 2 บรรทัด × 4 ห้อง หรือ 1 บรรทัด × 8 ห้อง ----------
    const LAYOUT_KEY = 'changLayout';
    const layoutSelect = document.getElementById('layoutSelect');
    function setLayout(n) {
      songEl.className = 'layout-' + n;
      layoutSelect.value = n;
      try { localStorage.setItem(LAYOUT_KEY, n); } catch (e) {}
    }
    layoutSelect.addEventListener('change', () => setLayout(layoutSelect.value));
    let savedLayout = '8';
    try { savedLayout = localStorage.getItem(LAYOUT_KEY) === '4' ? '4' : '8'; } catch (e) {}
    setLayout(savedLayout);

    shuffleEmoji();
    render();
  </script>
  <script src="nav.js"></script>
</body>
</html>
